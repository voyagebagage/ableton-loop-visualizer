name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      # GHSA-c475-qrg2-pj4r: basic-ftp via electrobun › proxy-agent; the app never opens FTP URLs.
      - run: bun run audit
      - run: bun run build
